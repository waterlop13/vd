<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aïda ❤️ Will You Be My Valentine?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sacramento&family=Montserrat:wght@400;700&display=swap');

  body {
    margin: 0;
    padding: 20px;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    text-align: center;
    overflow: hidden;
    min-height: 100vh;
  }

  /* Cat Frame (responsive) */
  .cat-frame {
    display: block;
    margin: 40px auto 20px auto;
    border: 5px solid #fff;
    border-radius: 25px;
    padding: 15px;
    width: 80%;
    max-width: 380px;
    box-shadow: 0 0 25px rgba(0,0,0,0.3);
  }
  .cat-frame img {
    width: 100%;
    height: auto;
    border-radius: 20px;
    display: block;
  }

  h1 {
    font-family: 'Sacramento', cursive;
    font-size: 3rem;
    color: #fff;
    margin: 20px 0 40px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
  }

  /* Buttons */
  button {
    font-size: 1.6rem;
    padding: 25px 50px;
    margin: 20px;
    border-radius: 15px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  #yes {
    background-color: #fff;
    color: #ff6b81;
  }

  #no {
    background-color: #ff6b81;
    color: #fff;
    position: relative;
  }

  /* Floating hearts */
  .heart {
    position: absolute;
    font-size: 20px;
    animation-name: floatHeart;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity: 0.9;
  }

  @keyframes floatHeart {
    0% { transform: translateY(0); opacity: 1; }
    50% { transform: translateY(-500px) rotate(360deg); opacity: 0.7; }
    100% { transform: translateY(0) rotate(720deg); opacity: 1; }
  }

  /* Confetti */
  .confetti {
    position: absolute;
    pointer-events: none;
    border-radius: 2px;
  }
</style>
</head>
<body>

<!-- Cat image -->
<div class="cat-frame">
  <img src="cat.jpg" alt="Cute cat drawing">
</div>

<h1>Aïda, will you be my Valentine? ❤️</h1>

<button id="yes">Yes</button>
<button id="no">No</button>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const yesButton = document.getElementById("yes");
  const noButton = document.getElementById("no");

  // Move "No" button on hover or touch
  function moveNoButton() {
    const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
    const y = Math.random() * (window.innerHeight - noButton.offsetHeight);
    noButton.style.position = 'absolute';
    noButton.style.left = x + 'px';
    noButton.style.top = y + 'px';
  }
  noButton.addEventListener("mouseover", moveNoButton);
  noButton.addEventListener("touchstart", moveNoButton);

  // Floating hearts
  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    const size = 15 + Math.random() * 25;
    heart.style.fontSize = size + "px";
    heart.style.left = Math.random() * window.innerWidth + "px";
    const hue = Math.random() * 360;
    heart.style.color = `hsl(${hue},70%,70%)`;
    const duration = 4 + Math.random() * 4;
    heart.style.animationDuration = duration + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), duration*1000);
  }
  setInterval(createHeart, 400);

  // Yes button click with realistic confetti
  yesButton.addEventListener("click", () => {
    alert("Happy Valentine's Day my love. Every video call, every message with you makes me realize I want to spend my life with you. I choose you every day and I'm so grateful to have you in my life ❤️");

    const confettiCount = 120;
    for (let i = 0; i < confettiCount; i++) {
      const confetti = document.createElement("div");
      confetti.className = "confetti";
      confetti.style.width = 5 + Math.random() * 5 + "px";
      confetti.style.height = 8 + Math.random() * 8 + "px";
      const hue = Math.random() * 360;
      confetti.style.backgroundColor = `hsl(${hue},70%,60%)`;
      confetti.style.left = Math.random() * window.innerWidth + "px";
      confetti.style.top = "-20px";
      confetti.style.opacity = Math.random() + 0.5;
      confetti.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(confetti);

      const fallDuration = 2 + Math.random() * 3;
      confetti.animate([
        { transform: `translateY(0px) rotate(0deg)`, opacity: 1 },
        { transform: `translateY(${window.innerHeight + 50}px) rotate(720deg)`, opacity: 0 }
      ], { duration: fallDuration*1000, easing: "cubic-bezier(0.5,0,0.5,1)", fill: "forwards" });

      setTimeout(() => confetti.remove(), fallDuration*1000);
    }
  });
});
</script>

</body>
</html>
